name: Build Zero 3W RTL88x2EU Package

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: Kernel ABI to build for
        required: false
        default: 6.1.84-16-rk2410-nocsf
      kernel_package_version:
        description: Debian package version for the kernel packages
        required: false
        default: 6.1.84-16
      package_version:
        description: Optional Debian package version override
        required: false
        default: ""
  push:
    branches:
      - stock_2026_driver
    paths:
      - ".github/scripts/build-zero3w-deb.sh"
      - ".github/workflows/build-zero3w-deb.yml"
      - ".github/workflows/*.yml"
      - "Makefile"
      - "dkms.conf"
      - "realtek_88x2eu.conf"
      - "*.c"
      - "*.h"
      - "*.mk"
      - "**/*.c"
      - "**/*.h"
      - "**/*.mk"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout driver
        uses: actions/checkout@v4

      - name: Set package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="${{ github.event.inputs.package_version || '' }}"
          if [[ -z "${package_version}" ]]; then
            package_version="2.6.openhd.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
          fi
          kernel_version="${{ github.event.inputs.kernel_version || '6.1.84-16-rk2410-nocsf' }}"
          kernel_package_version="${{ github.event.inputs.kernel_package_version || '6.1.84-16' }}"
          {
            echo "PACKAGE_VERSION=${package_version}"
            echo "KERNEL_VERSION=${kernel_version}"
            echo "KERNEL_PACKAGE_VERSION=${kernel_package_version}"
          } >> "${GITHUB_ENV}"

      - name: Build arm64 deb
        shell: bash
        env:
          PACKAGE_NAME: rtl88x2eu-ohd-zero3w
          MODULE_NAME: rtl88x2eu_ohd
        run: bash .github/scripts/build-zero3w-deb.sh

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl88x2eu-ohd-zero3w-${{ env.KERNEL_VERSION }}
          path: dist/*.deb
          if-no-files-found: error

      - name: Push deb to Cloudsmith
        if: github.event_name != 'pull_request'
        uses: cloudsmith-io/action@master
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          command: push
          format: deb
          owner: openhd
          repo: dev-release
          distro: debian
          release: bookworm
          republish: true
          file: dist/*.deb
